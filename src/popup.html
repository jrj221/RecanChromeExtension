<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebRecan</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon-32.png" alt="" width="28" height="28">
    <div class="titles">
      <h1>WebRecan</h1>
      <p>Settings</p>
    </div>
    <span id="version"></span>
  </header>

  <main>
    <details class="group">
      <summary>Hidden files</summary>
      <div class="body">
        <label class="row"><span class="label">Names starting with “test”</span><input class="switch" type="checkbox" id="hideTestFiles"></label>
        <label class="row"><span class="label">Names with “input” or “output”</span><input class="switch" type="checkbox" id="hideInputOutputFiles"></label>
        <label class="row"><span class="label">Names with "instructions"</span><input class="switch" type="checkbox" id="hideInstructionsRecording"></label>
        <p class="hint">Hidden files aren’t shown, analyzed, flagged or checked for code quality.</p>
      </div>
    </details>

    <details class="group">
      <summary>File order</summary>
      <div class="body" role="radiogroup" aria-label="File order">
        <label class="option"><input class="radio" type="radio" name="sortOrder" value="recordings"><span class="label">Recordings first</span></label>
        <label class="option"><input class="radio" type="radio" name="sortOrder" value="python"><span class="label">.py files first</span></label>
        <label class="option"><input class="radio" type="radio" name="sortOrder" value="default"><span class="label">Gradescope’s own order</span></label>
        <p class="hint">Alphabetical within each group.</p>
      </div>
    </details>

    <details class="group">
      <summary>Behavior</summary>
      <div class="body">
        <label class="row"><span class="label">Collapse the first file when a submission opens</span><input class="switch" type="checkbox" id="autoCollapse"></label>
      </div>
    </details>
  </main>

  <footer>
    <span id="status" role="status" aria-live="polite"></span>
    <button type="button" id="reset">Reset to defaults</button>
  </footer>

  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
